<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Your Innovation | Luxury Apple Booking</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;600&display=swap" rel="stylesheet">
    <style>
        .booking-container {
            width: 100%;
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h2 {
            font-size: 2rem;
            font-weight: 300;
            color: var(--gold);
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-family: var(--font-main);
            font-size: 1.1rem;
            padding: 10px 0;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-bottom: 2px solid var(--gold);
            margin-top: -1px;
            color: var(--gold-bright);
        }

        select option {
            background-color: #111;
            color: white;
        }

        .submit-btn {
            width: 100%;
            margin-top: 20px;
            background: var(--gold-gradient);
            color: black;
            border: none;
            cursor: pointer;
            padding: 15px;
            border-radius: 5px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            box-shadow: 0 0 30px var(--glow-gold);
            transform: scale(1.02);
        }

        .success-msg {
            display: none;
            text-align: center;
            color: var(--gold);
            margin-top: 30px;
            font-size: 1.2rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--gold);
        }
    </style>
</head>

<body>
    <canvas id="particleCanvas"></canvas>

    <div class="booking-container">
        <h2>Reserve the Future</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required placeholder="+1 234 567 890">
            </div>
            <div class="form-group">
                <label>Product Selection</label>
                <select id="product" required>
                    <option value="" disabled selected>Select a product...</option>
                    <option value="luxury-edition">Innovation Pro - Gold Edition</option>
                    <option value="ultra-luxury">Innovation Ultra - Matte Black</option>
                    <option value="bespoke">Bespoke Custom Build</option>
                </select>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="address" rows="2" placeholder="Full shipping address"></textarea>
            </div>
            <div class="form-group">
                <label>Additional Notes</label>
                <textarea id="notes" rows="2" placeholder="Any special requests?"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Request</button>
            <div id="success" class="success-msg">Your booking request has been submitted.</div>
            <a href="index.html" class="back-link">Return to Launchpad</a>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Particles for this page too
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() { width = innerWidth; height = innerHeight; canvas.width = width; canvas.height = height; }
        resize();
        window.onresize = resize;
        let p = Array(50).fill().map(() => ({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5 }));
        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(212, 175, 55, 0.2)';
            p.forEach(i => {
                i.x += i.vx; i.y += i.vy;
                if (i.x < 0 || i.x > width) i.vx *= -1; if (i.y < 0 || i.y > height) i.vy *= -1;
                ctx.beginPath(); ctx.arc(i.x, i.y, 1, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();

        // Form handling
        document.getElementById('bookingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.style.display = 'none';
            document.getElementById('success').style.display = 'block';
            gsap.from('#success', { opacity: 0, y: 10, duration: 1 });
        });
    </script>
</body>

</html>
